id: settlement-60-v0.1
version: 0.1
# Not frozen: thresholds still need validation with scripted fixtures and pilot runs. Changing one after freezing
# creates a new scenario version. region registration is not implemented yet, so this cannot run live.
frozen: false
maxAgents: 4
requiredAgents: 4
durationSeconds: 3600
objective: >-
  Establish a working settlement as a team. Scoring covers a shared shelter, a stone-or-better pickaxe for every
  participant, a shared crafting table, furnace and chest, renewable crops with completed harvest and replant cycles,
  a food reserve, and a healthy, connected team during the final ten minutes.
scorer: settlement-60
world:
  gameMode: survival
  difficulty: normal
  daylightCycle: natural
  respawn: true
  keepInventory: false
  startingInventory: empty
  crossRunMemory: false
reconnectPolicy: none
toolTimeoutMs: 120000
tools:
  - observe_world
  - inventory
  - inspect_block
  - look
  - go_to
  - return_to_surface
  - stop_action
  - gather
  - break_block
  - break_area
  - place
  - place_line
  - door
  - go_through_door
  - craft
  - smelt
  - deposit
  - withdraw
  - eat
  - equip
  - select_hotbar
  - use_item
  - interact_block
  - attack
  - flee
  - sleep
  - wake
  - send_dm
  - read_dms
  - message_status
  - directory
  - directory_search
  - wait
shelter:
  minInteriorWidth: 4
  minInteriorDepth: 4
  minInteriorHeight: 2
  maxInteriorWidth: 12
  maxInteriorDepth: 12
  maxInteriorHeight: 6
  minBlockLight: 8
  passable: [air, cave_air, torch, wall_torch]
  doors:
    [
      oak_door,
      spruce_door,
      birch_door,
      jungle_door,
      acacia_door,
      cherry_door,
      dark_oak_door,
      pale_oak_door,
      mangrove_door,
      bamboo_door,
      crimson_door,
      warped_door,
    ]
  safeFullBlocks:
    [
      oak_planks,
      spruce_planks,
      birch_planks,
      jungle_planks,
      acacia_planks,
      cherry_planks,
      dark_oak_planks,
      pale_oak_planks,
      mangrove_planks,
      bamboo_planks,
      crimson_planks,
      warped_planks,
      oak_log,
      spruce_log,
      birch_log,
      jungle_log,
      acacia_log,
      cherry_log,
      dark_oak_log,
      mangrove_log,
      cobblestone,
      stone,
      stone_bricks,
      bricks,
      deepslate,
      cobbled_deepslate,
      sandstone,
      smooth_stone,
      dirt,
      grass_block,
      podzol,
      coarse_dirt,
      glass,
    ]
pickaxes: [stone_pickaxe, iron_pickaxe, golden_pickaxe, diamond_pickaxe, netherite_pickaxe]
stations: [crafting_table, furnace, chest]
crops:
  blocks: [wheat, carrots, potatoes, beetroots]
  minLight: 9
  minEligibleCells: 16
  minVerifiedCycles: 8
foodReserve:
  windowSeconds: 600
  minUnitsAtEverySample: 40
  minUnitsAtCutoff: 80
  # Hunger points from minecraft-data 1.21.6. test/lab checks this table against the pinned package.
  # Excludes items with harmful effects (raw chicken, rotten flesh, spider eye, pufferfish, poisonous potato).
  nutrition:
    apple: 4
    baked_potato: 5
    beef: 3
    beetroot: 1
    beetroot_soup: 6
    bread: 5
    carrot: 3
    cooked_beef: 8
    cooked_chicken: 6
    cooked_cod: 5
    cooked_mutton: 6
    cooked_porkchop: 8
    cooked_rabbit: 5
    cooked_salmon: 6
    golden_carrot: 6
    melon_slice: 2
    mushroom_stew: 6
    mutton: 2
    porkchop: 3
    potato: 1
    pumpkin_pie: 8
    rabbit: 3
    rabbit_stew: 10
    sweet_berries: 2
    cod: 2
    salmon: 2
functioningTeam:
  windowSeconds: 600
  minFoodAtEverySample: 6
  minFoodAtCutoff: 12
  minHealthAtCutoff: 10
